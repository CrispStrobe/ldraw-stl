name: ci

# Tests on pull requests and on branches other than main (main runs them in pages.yml).

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

env:
  LDRAW_URL: https://library.ldraw.org/library/updates/complete.zip

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Which LDraw library is current
        id: lib
        run: |
          headers=$(curl -sfI "$LDRAW_URL")
          etag=$(printf '%s\n' "$headers" | grep -i '^etag:' | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '\r')
          modified=$(printf '%s\n' "$headers" | grep -i '^last-modified:' | cut -d' ' -f2- | tr -d '\r')
          echo "etag=$etag" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u -d "$modified" +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ldraw
          key: ldraw-complete-${{ steps.lib.outputs.etag }}
      - name: Download the LDraw library
        run: |
          mkdir -p ~/.cache/ldraw
          test -s ~/.cache/ldraw/complete.zip || curl -sfL -o ~/.cache/ldraw/complete.zip "$LDRAW_URL"
          unzip -tq ~/.cache/ldraw/complete.zip
      - name: Tests
        run: npm test
        env:
          LDRAW_LIB: ~/.cache/ldraw/complete.zip
      - name: Build the site
        run: |
          node scripts/build-library.mjs ~/.cache/ldraw/complete.zip dist --source-date "${{ steps.lib.outputs.date }}" --source-url "$LDRAW_URL"
          node scripts/build-web.mjs dist
      - name: Browser smoke test
        run: |
          npx playwright install --with-deps chromium
          node test/e2e/smoke.mjs dist
          node test/e2e/smoke.mjs dist --no-ranges
